qc:
  min_genes_per_cell: 100
  min_cells_per_gene: 50
  max_counts_per_cell: null

normalization:
  target_sum: 10000  #1e4
  log1p: true

replicates:
  pool: true

features:
  n_top_genes: 2000

pseudobulk:
  min_cells_per_group: 30

responders:
  noise_group_size: 100
  noise_repeats: 20
  threshold: 0.0215

fingerprint:
  type: morgan
  radius: 2
  n_bits: 1024
  dose_transform: log10

cv:
  method: GroupKFold
  n_splits: 5

ridge:
  alphas: [1000, 3000, 10000, 30000, 100000]
  inner_cv_splits: 4

random_forest:
  n_pcs: 50
  n_estimators: 300
  min_samples_leaf: 5
  random_state: 42

xgboost:
  n_pcs: 50
  n_estimators: 300
  learning_rate: 0.05
  max_depth: 4
  subsample: 0.8
  colsample_bytree: 0.5
  random_state: 42

mlp:
  n_pcs: 50
  hidden_layer_sizes: [256]
  alpha: 0.01
  early_stopping: true
  validation_fraction: 0.1
  max_iter: 500
  random_state: 42